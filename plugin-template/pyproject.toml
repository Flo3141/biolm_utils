[project]
name = "my-rna-model"
version = "0.1.0"
description = "My custom RNA model plugin for BioLM"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.0",
]

# Entry point registration - CRITICAL!
[project.entry-points."biolm.plugins"]
mymodel = "my_plugin.config:get_mymodel_config"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "my-rna-model"
version = "0.1.0"
description = "My custom RNA model plugin"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# For development: link to local framework
# biolm = {path = "../biolm_utils", develop = true}
# For production: use published version
# biolm = "^0.0.3"
