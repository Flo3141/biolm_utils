# BioLM Minimal Example Configuration
# ==============================================================
# This is the simplest possible configuration to get started.
# For more details, see README_CONFIGS.md
#
# To use:
#   poetry run biolm fine-tune --config-path ./exampleconfigs/minimal
#
# Change these three settings to run on your data:
# 1. outputpath: Where to save your model and logs
# 2. data_source.filepath: Path to your data file
# 3. plugin: Which model to use (saluki or xlnet)

mode: fine-tune
task: regression
plugin: saluki

# ============================================================
# REQUIRED: Output Directory
# ============================================================
# Use an absolute path for clarity and to avoid relative path issues
outputpath: /tmp/biolm_experiment

# ============================================================
# REQUIRED: Your Data File
# ============================================================
# Format: Each row has columns: ID, Label, Sequence
# Example (tab-separated):
#   seq_001	1.5	a,t,g,c,a,g,t,c,...
#   seq_002	2.3	a,t,g,c,a,g,t,c,...
#
# For Saluki: Sequences must be comma-separated nucleotides (a,t,g,c)
# For XLNet:  Sequences can be raw (ATGC or MKVL...)
data_source:
  filepath: /path/to/your/data.txt
  stripheader: false                      # Set to true if your file has a header
  columnsep: "\t"                         # Tab-separated: "\t", Comma: ",", Pipe: "|"
  tokensep: ","                           # How tokens are separated in sequences
  idpos: 1                                # Column with sequence ID (1-indexed!)
  seqpos: 3                               # Column with sequence (1-indexed!)
  labelpos: 2                             # Column with label/target (1-indexed!)
  splitratio: [80, 20]                    # [train%, val%] - must sum to 100

# ============================================================
# Training: Basic Settings
# ============================================================
training:
  seed: 42                                # For reproducibility
  batchsize: 8                            # Adjust based on GPU memory
  nepochs: 50                             # Increase for better accuracy
  patience: 5                             # Early stopping after N epochs without improvement

# ============================================================
# Tokenization: Usually Plugin-Specific
# ============================================================
# For Saluki: encoding MUST be "atomic" (one-hot nucleotides)
# For XLNet:  encoding can be "bpe" (byte-pair encoding)
tokenization:
  encoding: atomic                        # Set by plugin; don't override
  vocabsize: 20000                        # Ignored for Saluki (uses 4: a,t,g,c)

# ============================================================
# MLflow Experiment Tracking (Optional)
# ============================================================
settings:
  mlflow:
    enabled: true                         # Track experiments in MLflow
    tracking_uri: null                    # Auto-set; you can override
    experiment_name: null                 # Auto-set; you can override

# ============================================================
# Advanced Settings (Usually Don't Touch)
# ============================================================
debugging:
  silent: false
  dev: false                              # Set to true for quick testing on mini dataset
  accelerator: auto                       # Let system choose (cpu/gpu/tpu)
