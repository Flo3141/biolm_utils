# @package _global_

defaults:
  - _self_
  - mode: tokenize

# Core settings
# mode: tokenize
outputpath: null
task: null
plugin: null
model: {}

# Data source (will be overridden by mode-specific defaults)
data_source:
  filepath: null
  stripheader: false
  columnsep: "\t"
  tokensep: ","
  specifiersep: null
  idpos: 1
  seqpos: 1
  labelpos: 2
  crossvalidation: null
  splitratio: null
  splitpos: null
  devsplits: null
  testsplits: null

# Tokenization settings
tokenization:
  samplesize: null
  encoding: atomic
  lefttailing: false
  vocabsize: 20000
  minfreq: 2
  maxtokenlength: 10
  atomicreplacements: null

# Training settings
training:
  seed: 42
  batchsize: 8
  gradacc: 4
  nepochs: 100
  num_epochs: null
  patience: 10
  resume: false
  scaling: log
  weightedregression: false

# Inference settings
inference:
  pretrainedmodel: null
  looscores:
    handletokens: null
    replacementdict: null
    replacespecifier: false

# Settings (for advanced configurations)

# Data pre-processing options (kept under settings for plugin-level controls)
settings:
  data_pre_processing:
    centertoken: false
    only512: false
    _3utr: false
    non3utr: false
    nomarkers: false
    weightpos: null
  # Optional MLflow integration (disabled by default). Enable for automatic
  # experiment tracking with metrics, parameters, and artifacts.
  mlflow:
    enabled: false
    tracking_uri: null  # null = local ./mlruns (default)
    experiment_name: null  # null = auto-derived from outputpath
    log_artifacts: true

# Debugging settings
debugging:
  silent: false
  dev: false
  getdata: false
  forcenewdata: false
  accelerator: cpu