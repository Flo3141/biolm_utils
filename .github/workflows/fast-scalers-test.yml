name: Fast scaler test

on:
  push:
    branches: [ main, biolm-2.0 ]
  pull_request:
    branches: [ main, biolm-2.0 ]

jobs:
  scaler-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry and deps (dev)
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version
          poetry config virtualenvs.in-project true --local || true
          poetry install --no-interaction --with dev

      - name: Run scaler unit test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pytest -q tests/test_scaler_metadata.py
