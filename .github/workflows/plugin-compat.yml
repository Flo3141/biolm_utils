name: Plugin compatibility (smoke)

on:
  push:
    branches: [ main, biolm-2.0 ]
  pull_request:
    branches: [ main, biolm-2.0 ]

jobs:
  plugin-compatibility:
    runs-on: ubuntu-latest
    name: Install plugins and test discovery
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: biolm_utils

      - name: Checkout Saluki plugin
        uses: actions/checkout@v4
        with:
          repository: dieterich-lab/rna_saluki_cnn
          ref: saluki-2.0
          path: rna_saluki_cnn

      - name: Checkout XLNet plugin
        uses: actions/checkout@v4
        with:
          repository: dieterich-lab/rna_protein_xlnet
          ref: main
          path: rna_protein_xlnet

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version

      - name: Install plugins
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Install Saluki plugin
          cd rna_saluki_cnn
          poetry install --no-interaction
          cd ..
          # Install XLNet plugin
          cd rna_protein_xlnet
          poetry install --no-interaction
          cd ..

      - name: Install framework with plugin dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd biolm_utils
          # Update paths in pyproject.toml to CI workspace structure
          sed -i 's|/home/pwiesenbach/rna_saluki_cnn|../rna_saluki_cnn|g' pyproject.toml
          sed -i 's|/home/pwiesenbach/rna_protein_xlnet|../rna_protein_xlnet|g' pyproject.toml
          poetry lock --no-update
          poetry install --no-interaction --with plugins

      - name: Run plugin discovery tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd biolm_utils
          poetry run pytest -xvs tests/integration/test_plugin_discovery.py
